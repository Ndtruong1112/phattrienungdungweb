<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đào Tạo & Sinh Viên - Spring Boot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); border: none; }
        .table { vertical-align: middle; }
        .badge-dept { background-color: #e3f2fd; color: #0d6efd; font-weight: 600; padding: 6px 10px; border-radius: 6px; }
        .query-box { background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%); border: 1px solid #c7d2fe; border-radius: 10px; }
    </style>
</head>
<body class="py-4">
    <div class="container">
        <!-- Header -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">🎓 Hệ Thống Quản Lý Đào Tạo & Sinh Viên</h2>
            <p class="text-muted">Spring Boot Enterprise Architecture: Controller (rest) • Service (service/impl) • DAO (dao/impl) • Hibernate/MySQL</p>
        </div>

        <div class="row g-4">
            <!-- Cột Thêm / Cập nhật sinh viên -->
            <div class="col-lg-4">
                <div class="card p-4">
                    <h4 id="formTitle" class="fw-bold mb-3 text-dark">➕ Thêm Sinh Viên Mới</h4>
                    <input type="hidden" id="studentId">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ và Tên (Student Name) <span class="text-danger">*</span></label>
                        <input type="text" id="name" class="form-control" placeholder="Ví dụ: Nguyen Van A">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Ngày sinh (Date of Birth) <span class="text-danger">*</span></label>
                        <input type="date" id="dob" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Khoa / Ngành (Department)</label>
                        <select id="departmentSelect" class="form-select">
                            <option value="1">1 - Công nghệ thông tin (CNTT)</option>
                            <option value="2">2 - Khoa học máy tính (KHMT)</option>
                            <option value="3">3 - Quản trị kinh doanh (QTKD)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Ví dụ: vana@gmail.com">
                    </div>

                    <div class="d-grid gap-2">
                        <button id="btnSave" class="btn btn-primary fw-semibold" onclick="saveStudent()">Lưu vào MySQL</button>
                        <button id="btnCancel" class="btn btn-outline-secondary d-none" onclick="cancelEdit()">Hủy cập nhật</button>
                    </div>
                </div>
            </div>

            <!-- Cột Danh Sách Sinh Viên -->
            <div class="col-lg-8">
                <div class="card p-4">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                        <h4 class="fw-bold m-0 text-dark" id="tableHeaderTitle">📋 Danh Sách Sinh Viên</h4>
                        <button class="btn btn-sm btn-outline-primary" onclick="loadStudents()">🔄 Làm mới</button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover table-bordered">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 70px;">ID</th>
                                    <th>Họ và Tên</th>
                                    <th>Ngày Sinh</th>
                                    <th>Khoa / Ngành</th>
                                    <th>Email</th>
                                    <th style="width: 130px;" class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody">
                                <!-- Dữ liệu load tự động -->
                            </tbody>
                        </table>
                    </div>
                    <div id="loading" class="text-center text-muted py-3">Đang tải dữ liệu từ MySQL...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/students';

        function renderStudents(students) {
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';

            if (!students || students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">Chưa có sinh viên nào trong CSDL</td></tr>';
                return;
            }

            students.forEach(s => {
                const sId = s.studentId || s.id;
                const sName = s.studentName || s.name || '';
                const safeName = sName.replace(/'/g, "\\'");
                const sEmail = s.email || '';
                const safeEmail = sEmail.replace(/'/g, "\\'");
                const sDob = s.dob || '';
                const deptName = s.department ? s.department.departmentName : ('Khoa #' + (s.departmentId || ''));
                const deptId = s.departmentId || (s.department ? s.department.departmentId : 1);

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${sId}</td>
                        <td class="fw-semibold text-dark">${sName}</td>
                        <td>${sDob ? sDob : '<span class="text-muted">Chưa có</span>'}</td>
                        <td><span class="badge-dept">${deptName}</span></td>
                        <td>${sEmail}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-warning me-1" onclick="editStudent(${sId}, '${safeName}', '${sDob}', ${deptId}, '${safeEmail}')">Sửa</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${sId})">Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function loadStudents() {
            document.getElementById('loading').classList.remove('d-none');
            try {
                const response = await fetch(API_URL);
                const students = await response.json();
                renderStudents(students);
                document.getElementById('tableHeaderTitle').innerText = '📋 Danh Sách Sinh Viên (' + students.length + ')';
            } catch (err) {
                console.error("Lỗi khi tải dữ liệu:", err);
            } finally {
                document.getElementById('loading').classList.add('d-none');
            }
        }

        async function saveStudent() {
            const id = document.getElementById('studentId').value;
            const name = document.getElementById('name').value.trim();
            const dob = document.getElementById('dob').value;
            const departmentId = parseInt(document.getElementById('departmentSelect').value);
            const email = document.getElementById('email').value.trim();

            if (!name) {
                alert("Vui lòng nhập Họ và Tên sinh viên!");
                return;
            }

            const studentData = {
                studentName: name,
                dob: dob ? dob : null,
                departmentId: departmentId,
                email: email
            };

            try {
                if (id) {
                    await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(studentData)
                    });
                } else {
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(studentData)
                    });
                }

                cancelEdit();
                loadStudents();
            } catch (err) {
                alert("Lỗi khi lưu dữ liệu: " + err);
            }
        }

        async function deleteStudent(id) {
            if (confirm(`Bạn có chắc muốn xóa sinh viên ID = ${id}?`)) {
                try {
                    await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    loadStudents();
                } catch (err) {
                    alert("Lỗi khi xóa: " + err);
                }
            }
        }

        function editStudent(id, name, dob, deptId, email) {
            document.getElementById('studentId').value = id;
            document.getElementById('name').value = name;
            document.getElementById('dob').value = dob;
            document.getElementById('departmentSelect').value = deptId || 1;
            document.getElementById('email').value = email;

            document.getElementById('formTitle').innerText = '✏️ Cập Nhật Sinh Viên';
            document.getElementById('btnSave').innerText = 'Lưu Thay Đổi';
            document.getElementById('btnCancel').classList.remove('d-none');
        }

        function cancelEdit() {
            document.getElementById('studentId').value = '';
            document.getElementById('name').value = '';
            document.getElementById('dob').value = '';
            document.getElementById('departmentSelect').value = 1;
            document.getElementById('email').value = '';

            document.getElementById('formTitle').innerText = '➕ Thêm Sinh Viên Mới';
            document.getElementById('btnSave').innerText = 'Lưu vào MySQL';
            document.getElementById('btnCancel').classList.add('d-none');
        }

        loadStudents();
    </script>
</body>
</html>
